#ddev-generated
services:
  web:
    environment:
      FLYSYSTEM_CONFIG_FILE: /config/flysystem_config.json
    configs:
      - source: flysystem_config.json
        target: /config/flysystem_config.json
        # XXX: Despite the default being described as `0444`, it seems to get
        # `0440` if not set; so, set it.
        mode: 0444
configs:
  flysystem_config.json:
    content: |
      {
        "repo-bin": {
          "driver": "dgi_s3",
          "config": {
            "key": "ddevminio",
            "secret": "ddevminio",
            "bucket": "flysystem",
            "public": false,
            "region": "us-east-1",
            "prefix": "repo-bin",
            "endpoint": "$DDEV_PRIMARY_URL:10101",
            "use_path_style_endpoint": true
          },
          "cache": true
        },
        "repo-meta": {
          "driver": "dgi_local",
